services:
  backend:
    build:
      context: ./backend
    container_name: foreman-backend
    environment:
      FOREMAN_DATABASE_URL: sqlite:////data/foreman.db
    restart: unless-stopped
    volumes:
      - foreman-data:/data

  frontend:
    build:
      context: ./frontend
    container_name: foreman-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  foreman-data:
